services:
  production:
    build: .
    ports: ["3000:3000"]
    volumes: ["scores:/app/data"]
    restart: unless-stopped
    profiles: [production]
  deploy:
    # Production on the deploy host (see deploy.sh). dist/ is prebuilt locally.
    build: { context: ., dockerfile: Dockerfile.deploy }
    ports: ["127.0.0.1:${PORT:-3020}:3000"]
    volumes: ["./data:/app/data"]
    restart: unless-stopped
    profiles: [deploy]
  game:
    image: node:24-bookworm-slim
    working_dir: /app
    user: "1000:1000"
    ports: ["5173:5173"]
    volumes: [".:/app", "./node_modules:/app/node_modules"]
    command: npm run dev
  tooling:
    build: { context: ., dockerfile: Dockerfile.tools }
    working_dir: /app
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /app/.cache/playwright
    volumes: [".:/app", "./node_modules:/app/node_modules"]
    profiles: [tools]
  generation:
    image: node:24-bookworm-slim
    working_dir: /app
    user: "1000:1000"
    volumes:
      [
        "./scripts:/app/scripts",
        "./assets:/app/assets",
        "./public/assets:/app/public/assets",
      ]
    environment:
      FAL_KEY: ${FAL_KEY}
    command: node scripts/assets.mjs
    profiles: [assets]
volumes:
  scores:
