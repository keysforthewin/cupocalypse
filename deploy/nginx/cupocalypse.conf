# Cupocalypse at https://fruitcupfucks.com/cup — paste inside the fruit
# server { } block in /etc/nginx/sites-available/fruit.
# The app is built with Vite base /cup/; nginx strips the prefix and the
# Node server (docker compose "deploy" service, 127.0.0.1:3020) serves at /.

location = /cup { return 301 /cup/; }

location /cup/ {
    # Umami tag (added 2026-09-24): Cupocalypse is its own property with its own
    # website entry. This sub_filter REPLACES the inherited server-level one.
    # Do not delete it -- deleting it makes the game report as Fruit Cups Movie.
    # Checked daily by umami-tagcheck.sh (umami-bridge repo) as `cup`.
    proxy_set_header Accept-Encoding "";   # sub_filter needs uncompressed HTML
    sub_filter '</head>' '<script defer src="/pulse/script.js" data-website-id="06d71a7c-d314-49d7-9284-1a838e77c881"></script></head>';
    sub_filter_once on;
    sub_filter_types text/html;
    proxy_pass http://127.0.0.1:3020/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /cup;
    proxy_read_timeout 60s;
}
