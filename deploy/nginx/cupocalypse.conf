# Cupocalypse at https://fruitcupfucks.com/cup — paste inside the fruit
# server { } block in /etc/nginx/sites-available/fruit.
# The app is built with Vite base /cup/; nginx strips the prefix and the
# Node server (docker compose "deploy" service, 127.0.0.1:3020) serves at /.

location = /cup { return 301 /cup/; }

location /cup/ {
    # Not Umami-tagged as the parent site: this sub_filter overrides the
    # server-level one so the game is not counted as Fruit Cups Movie traffic.
    sub_filter '@@umami-never-matches@@' '';
    proxy_pass http://127.0.0.1:3020/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /cup;
    proxy_read_timeout 60s;
}
